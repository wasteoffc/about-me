<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Aesthetic Scroll</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
  overflow-x: hidden;
}

section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: relative;
  padding: 20px;
}

/* FULLSCREEN IMAGE */
.model-top {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* overlay */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  top: 0;
  left: 0;
  z-index: -1;
}

/* cards */
.card {
  background: rgba(20,20,20,0.7);
  backdrop-filter: blur(10px);
  border-radius: 25px;
  padding: 25px;
  text-align: center;
  max-width: 350px;
  position: relative;
  z-index: 2;
}

.title {
  font-size: 28px;
  color: #cbb7ff;
}

.subtitle {
  font-size: 16px;
  color: #aaa;
}

.image {
  width: 100%;
  border-radius: 15px;
  margin-top: 15px;
  transition: transform 0.8s;
}

.image:hover {
  transform: scale(1.05);
}

/* animations */
.hidden {
  opacity: 0;
  transition: all 0.8s ease;
}

.from-left { transform: translateX(-80px); }
.from-right { transform: translateX(80px); }
.from-bottom { transform: translateY(40px); }

.show {
  opacity: 1;
  transform: translate(0,0);
}

.delay1 { transition-delay: 0.2s; }
.delay2 { transition-delay: 0.5s; }
.delay3 { transition-delay: 0.8s; }

/* floating stars */
.star {
  position: absolute;
  font-size: 18px;
  color: #888;
  animation: float 6s infinite ease-in-out;
}

.star:nth-child(1) { top: 20%; left: 10%; }
.star:nth-child(2) { top: 70%; left: 80%; }
.star:nth-child(3) { top: 40%; left: 75%; }

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0); }
}

/* bottom model */
.model-bottom {
  position: absolute;
  bottom: 0;
  width: 180px;
}

.big {
  font-size: 48px;
  color: #cbb7ff;
}

</style>
</head>

<body>

<!-- FIRST -->
<section>

  <!-- ФОН -->
  <img class="model-top" src="start.jpg">
  <div class="overlay"></div>

  <div class="star">✧</div>
  <div class="star">✦</div>
  <div class="star">✧</div>

  <div class="card">
    <div class="title hidden from-left delay1">welcome</div>
    <div class="subtitle hidden from-right delay2">scroll down</div>
  </div>

</section>

<!-- SECOND -->
<section>
  <div class="card">
    <div class="title hidden from-right delay1">about me</div>

    <!-- GIF (будет норм на чёрном фоне) -->
    <img class="image hidden from-left delay2" src="bigvox.gif">

    <div class="subtitle hidden from-bottom delay3">your info here</div>
  </div>
</section>

<!-- THIRD -->
<section>
  <div class="card">
    <div class="title hidden from-left delay1">links</div>
    <div class="subtitle hidden from-right delay2">inst / tg / etc</div>
  </div>
</section>

<!-- LAST -->
<section>
  <div class="big hidden from-bottom delay1">RENTRY</div>

  <img class="model-bottom hidden from-bottom delay2" src="finish.jpg">
</section>

<script>
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
    }
  });
});

document.querySelectorAll(".hidden").forEach(el => observer.observe(el));
</script>

</body>
</html>
